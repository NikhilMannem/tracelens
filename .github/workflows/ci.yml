name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: tracelens
          POSTGRES_PASSWORD: tracelens_ci
          POSTGRES_DB: tracelens
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tracelens -d tracelens"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      POSTGRES_USER: tracelens
      POSTGRES_PASSWORD: tracelens_ci
      POSTGRES_DB: tracelens
      PGPASSWORD: tracelens_ci

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Apply database schema
        run: |
          for file in sql/*.sql; do
            echo "Applying $file"
            psql -h localhost -U tracelens -d tracelens -v ON_ERROR_STOP=1 -f "$file"
          done

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  workers:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: workers

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workers/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run build
