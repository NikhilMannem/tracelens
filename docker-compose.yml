
services:
  rabbitmq:
    image: rabbitmq:4-management
    container_name: tracelens-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: tracelens
      RABBITMQ_DEFAULT_PASS: tracelens_local_dev
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:17
    container_name: tracelens-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: tracelens-backend
    env_file:
      - .env
    environment:
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      RABBITMQ_URL: amqp://tracelens:tracelens_local_dev@rabbitmq:5672
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  log-worker:
    build:
      context: ./workers
    container_name: tracelens-log-worker
    command: ["node", "dist/log-worker.js"]
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      RABBITMQ_URL: amqp://tracelens:tracelens_local_dev@rabbitmq:5672
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  metrics-worker:
    build:
      context: ./workers
    container_name: tracelens-metrics-worker
    command: ["node", "dist/metrics-worker.js"]
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      RABBITMQ_URL: amqp://tracelens:tracelens_local_dev@rabbitmq:5672
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:3000
    container_name: tracelens-frontend
    ports:
      - "8081:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  rabbitmq_data:
